
name: Feature request
description: A new idea for a feature.
title: "[Feature]: "
labels: ["feature request"]
body:
- type: markdown
  attributes:
      value: |
        Thanks for taking the time to fill out this!

- type: textarea
  id: idea
  attributes:
      label: What is your idea?
      description: Also tell us, what do you want in comming updates?
      placeholder: Write it down here!
      value: "Feature request!"
  validations:
      required: true
- type: upload
  id: screenshots
  attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your problem.
  validations:
      required: false

